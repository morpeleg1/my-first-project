<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הפרויקט הראשון שלי</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Rubik", Arial, sans-serif;
      color: #2d2a4a;
      background: linear-gradient(135deg, #fde2e4, #e2ecf9, #e8f7ee, #fff4d6);
      background-size: 400% 400%;
      animation: background-shift 15s ease infinite;
      overflow: hidden;
    }

    @keyframes background-shift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      text-align: center;
      padding: 48px 56px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(80, 70, 140, 0.15);
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0 0 32px;
      font-size: 56px;
      font-weight: 800;
      background: linear-gradient(90deg, #7c3aed, #ec4899, #f59e0b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    button {
      padding: 16px 40px;
      font-family: inherit;
      font-size: 22px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
      transition: transform 0.15s, box-shadow 0.15s;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { translate: 0 0; }
      50%      { translate: 0 -6px; }
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(124, 58, 237, 0.4);
    }

    button:active {
      transform: translateY(1px);
    }

    #greeting {
      margin: 28px 0 0;
      font-size: 26px;
      min-height: 1.5em;
    }

    #greeting.show {
      animation: pop-in 0.5s ease;
    }

    @keyframes pop-in {
      0%   { opacity: 0; transform: scale(0.6); }
      70%  { transform: scale(1.1); }
      100% { opacity: 1; transform: scale(1); }
    }

    .nav-link {
      display: inline-block;
      margin-top: 20px;
      color: #7c3aed;
      text-decoration: none;
      font-size: 17px;
    }

    .nav-link:hover {
      text-decoration: underline;
    }

    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>הפרויקט הראשון שלי</h1>
    <button id="greet-button">לחץ כאן</button>
    <p id="greeting"></p>
    <a class="nav-link" href="todo.html">📋 לרשימת המשימות שלי</a>
  </div>
  <canvas id="confetti"></canvas>

  <script>
    const button = document.getElementById("greet-button");
    const greeting = document.getElementById("greeting");
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    const colors = ["#7c3aed", "#ec4899", "#f59e0b", "#10b981", "#3b82f6", "#ef4444"];
    const greetings = [
      "שלום! ברוך הבא לפרויקט הראשון שלך 🎉",
      "שיהיה לך יום נפלא ומלא חיוכים ☀️",
      "אתה אלוף! תמשיך ככה 🏆",
      "כל צעד קטן הוא התחלה של משהו גדול 🌱",
      "איזה כיף שבאת! 💜"
    ];
    let lastGreeting = -1;
    let pieces = [];
    let animating = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    function launchConfetti() {
      const rect = button.getBoundingClientRect();
      const startX = rect.left + rect.width / 2;
      const startY = rect.top;

      for (let i = 0; i < 150; i++) {
        const angle = Math.random() * Math.PI - Math.PI;
        const speed = 6 + Math.random() * 10;
        pieces.push({
          x: startX,
          y: startY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 6 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          spin: (Math.random() - 0.5) * 12
        });
      }

      if (!animating) {
        animating = true;
        requestAnimationFrame(drawConfetti);
      }
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      pieces.forEach(p => {
        p.vy += 0.3;          // gravity
        p.vx *= 0.99;         // air resistance
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.spin;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      });

      pieces = pieces.filter(p => p.y < canvas.height + 20);

      if (pieces.length > 0) {
        requestAnimationFrame(drawConfetti);
      } else {
        animating = false;
      }
    }

    button.addEventListener("click", () => {
      // pick a random greeting, never the same one twice in a row
      let index;
      do {
        index = Math.floor(Math.random() * greetings.length);
      } while (index === lastGreeting);
      lastGreeting = index;
      greeting.textContent = greetings[index];
      greeting.classList.remove("show");
      void greeting.offsetWidth; // restart the animation
      greeting.classList.add("show");
      launchConfetti();
    });
  </script>
</body>
</html>
